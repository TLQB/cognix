version: 2.1

jobs:
  build-linux:
    machine:
      image: ubuntu-2004:current
    resource_class: large  # 4 CPU, 8GB RAM
    
    steps:
      - checkout
      
      - run:
          name: Install Linux dependencies
          command: |
            export DEBIAN_FRONTEND=noninteractive
            export NEEDRESTART_MODE=l
            ./script/linux
          no_output_timeout: 15m
      
      - run:
          name: System Info
          command: |
            echo "=== System Info ==="
            free -h
            df -h /
            nproc
            cat /etc/os-release
            ldd --version 2>&1 | head -1
            rustc --version
            cargo --version
            echo "=================="
      
      - restore_cache:
          keys:
            - rust-cache-v2004-{{ checksum "Cargo.lock" }}
            - rust-cache-v2004-
      
      - run:
          name: Build
          command: |
            export CARGO_BUILD_JOBS=2
            cargo build --release -p zed
          no_output_timeout: 60m
      
      - save_cache:
          key: rust-cache-v2004-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target
      
      - run:
          name: Strip binary
          command: |
            strip target/release/zed
            ls -lah target/release/zed
      
      - store_artifacts:
          path: target/release/zed
          destination: cognix-linux-x86_64

workflows:
  version: 2
  build:
    jobs:
      - build-linux
