version: 2.1

jobs:
  build-linux:
    docker:
      - image: rust:1.75-bullseye
    resource_class: large  # 4 CPU, 8GB RAM
    
    steps:
      - checkout
      
      - run:
          name: Install Linux dependencies
          command: |
            apt-get update
            apt-get install -y --no-install-recommends \
              gcc g++ make cmake clang lld llvm \
              libasound2-dev libfontconfig-dev libgit2-dev \
              libglib2.0-dev libssl-dev libva-dev \
              libvulkan-dev libwayland-dev libx11-xcb-dev \
              libxkbcommon-x11-dev libzstd-dev \
              jq curl gettext-base elfutils \
              libsqlite3-dev musl-tools musl-dev \
              pkg-config
          no_output_timeout: 10m
      
      - run:
          name: System Info
          command: |
            echo "=== System Info ==="
            free -h
            df -h /
            nproc
            rustc --version
            cargo --version
            echo "=================="
      
      - restore_cache:
          keys:
            - rust-cache-v1-{{ checksum "Cargo.lock" }}
            - rust-cache-v1-
      
      - run:
          name: Build
          command: |
            export CARGO_BUILD_JOBS=2
            cargo build --release -p zed
          no_output_timeout: 60m
      
      - save_cache:
          key: rust-cache-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target
      
      - run:
          name: Strip binary
          command: |
            strip target/release/zed
            ls -lah target/release/zed
      
      - store_artifacts:
          path: target/release/zed
          destination: cognix-linux-x86_64

workflows:
  version: 2
  build:
    jobs:
      - build-linux
