name: Bundle Release

# Builds the all-in-one Freeclaude bundle (TUI + proxy) for Linux and
# Windows, runs smoke tests, and attaches archives to a GitHub Release.
#
# The TUI comes from a freebuff-src checkout containing the Freeclaude
# patches (rename, drag-drop, session fixes) — the public CodebuffAI/
# freebuff upstream does NOT have them. Configure in Settings → Secrets
# and variables → Actions:
#   FREEBUFF_REPO_NAME (secret)  repo to checkout, e.g. "TLQB/freebuff-private"
#   FREEBUFF_PAT       (secret)  a fine-grained PAT with Contents:read on it
#   FREEBUFF_REF       (variable) branch/tag to build from (default main)
#
# Fallback: leave FREEBUFF_REPO_NAME unset and the workflow checks out
# public CodebuffAI/freebuff instead — the bundle still builds, but the
# Freeclaude branding patches will be missing.

on:
  push:
    branches: [main, freebuff-compat]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (e.g. 1.0.0)'
        required: false
        default: ''
      skip_windows:
        description: 'Skip Windows bundle'
        type: boolean
        default: false

permissions:
  contents: write   # required to create the GitHub Release and upload assets

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (mock upstream + qwen gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout zai-proxy
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build proxy
        run: go build -o /tmp/zai-proxy .

      - name: Unit tests
        run: go test ./... -count=1

      - name: Start mock Z.AI upstream
        run: |
          nohup python3 scripts/e2e/mock_zai_upstream.py 39877 > /tmp/mock.log 2>&1 &
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:39877/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:39877/ >/dev/null || { echo "mock did not start"; cat /tmp/mock.log; exit 1; }

      - name: Start proxy against mock
        run: |
          nohup env PORT=3002 AUTH_TOKEN=e2e-token ZAI_TOKEN=mock-stub-token \
            ZAI_BASE_URL=http://127.0.0.1:39877 LOG_LEVEL=info \
            /tmp/zai-proxy --agent-mode > /tmp/proxy.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -H "Authorization: Bearer e2e-token" http://localhost:3002/v1/models >/dev/null && break
            sleep 1
          done
          curl -sf -H "Authorization: Bearer e2e-token" http://localhost:3002/v1/models >/dev/null || { echo "proxy did not start"; tail -50 /tmp/proxy.log; exit 1; }

      - name: Smoke test (nonstream + stream)
        run: python3 scripts/e2e/smoke_test.py

      - name: Agent E2E (multi-turn tool loop)
        run: python3 scripts/e2e/agent_e2e.py

      - name: Qwen gateway merge check (mock qwen upstream)
        run: |
          # Spin a SECOND proxy instance on :3006 with QWEN_PROXY_URL pointing
          # at a stub server that serves one qwen model, and assert /v1/models
          # contains BOTH the GLM mock entry and the stubbed qwen entry.
          # (A second instance is needed because the step-4 proxy on :3002
          # was started WITHOUT QWEN_PROXY_URL.)
          python3 - <<'EOF' &
          import http.server, json, threading
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/v1/models':
                      body = json.dumps({"data": [{"id": "qwen-stub-max",
                          "display_name": "Qwen-Stub-Max", "description": "stub"}]}).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              def log_message(self, *a): pass
          s = http.server.HTTPServer(('127.0.0.1', 39878), H)
          threading.Thread(target=s.serve_forever, daemon=True).start()
          import time; time.sleep(120)
          EOF
          sleep 2
          PORT=3006 AUTH_TOKEN=e2e-token ZAI_TOKEN=mock-stub-token \
            ZAI_BASE_URL=http://127.0.0.1:39877 QWEN_PROXY_URL=http://127.0.0.1:39878 \
            /tmp/zai-proxy --agent-mode > /tmp/proxy-gw.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -H "Authorization: Bearer e2e-token" http://localhost:3006/v1/models >/dev/null && break
            sleep 1
          done
          MODELS=$(curl -sf -H "Authorization: Bearer e2e-token" http://localhost:3006/v1/models)
          echo "$MODELS" | grep -q qwen-stub-max || { echo "qwen models NOT merged:"; echo "$MODELS"; exit 1; }
          echo "gateway merge OK: $MODELS" | head -c 400
          kill %1 2>/dev/null || true

      - name: Dump logs on failure
        if: failure()
        run: |
          echo '=== proxy.log ==='; tail -100 /tmp/proxy.log || true
          echo '=== mock.log ==='; tail -50 /tmp/mock.log || true

  qwen:
    name: Qwen bridge (bundled)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout zai-proxy
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit + blackbox tests
        run: |
          cd qwen-bridge
          go test ./... -count=1

      - name: Build qwen-proxy (linux)
        run: |
          cd qwen-bridge
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o /tmp/qwen-proxy .
          PORT=3098 AUTH_TOKEN=e2e-token ZAI_TOKEN=stub /tmp/qwen-proxy --help >/dev/null 2>&1 || true
          echo "qwen-proxy builds clean"

  bundle:
    name: Bundle ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]

    steps:
      - name: Checkout zai-proxy
        uses: actions/checkout@v4

      - name: Resolve freebuff source repo
        id: fbsrc
        run: |
          if [ -n "${{ secrets.FREEBUFF_REPO_NAME }}" ]; then
            echo "repo=${{ secrets.FREEBUFF_REPO_NAME }}" >> "$GITHUB_OUTPUT"
            echo "token=${{ secrets.FREEBUFF_PAT }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=CodebuffAI/freebuff" >> "$GITHUB_OUTPUT"
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout freebuff-src
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.fbsrc.outputs.repo }}
          ref: ${{ vars.FREEBUFF_REF || 'main' }}
          token: ${{ steps.fbsrc.outputs.token }}
          path: freebuff-src

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install freebuff deps
        run: |
          cd freebuff-src
          bun install --frozen-lockfile

      - name: Build bundle (${{ matrix.platform }})
        env:
          FREEBUFF_SRC: ${{ github.workspace }}/freebuff-src
        run: |
          if [ "${{ matrix.platform }}" = "windows" ] && [ "${{ inputs.skip_windows }}" = "true" ]; then
            echo "skip_windows=true — skipping Windows build"
            exit 0
          fi
          ./scripts/bundle/make-bundle.sh "${{ steps.ver.outputs.version }}" "${{ matrix.platform }}"

      - name: Smoke test proxy binary (linux only)
        if: matrix.platform == 'linux'
        run: |
          # The proxy binary must start, listen, and answer healthz 200.
          PORT=3099 ZAI_TOKEN=stub LOG_LEVEL=info \
            ./dist/freeclaude-linux-x64/zai-proxy --agent-mode &
          PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3099/api/healthz >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"; kill $PID; exit 0
            fi
            sleep 1
          done
          echo "FAIL: proxy did not answer healthz in 20s"; kill $PID; exit 1

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeclaude-${{ matrix.platform }}-x64
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: warn

  release:
    name: Create release
    needs: [bundle, e2e, qwen]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release with archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Freeclaude $TAG" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip
