name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest  # 4 vCPUs, 16 GB RAM
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=l
          ./script/linux

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "cognix-linux-v2"
          workspaces: "."
          shared-key: "linux-release"

      - name: System Info
        run: |
          echo "=== System Info ==="
          free -h
          df -h /
          nproc
          rustc --version
          cargo --version
          echo "=================="

      - name: Build
        run: |
          export CARGO_BUILD_JOBS=4
          cargo build --release -p zed
        timeout-minutes: 180

      - name: Strip binary
        run: |
          strip target/release/zed
          ls -lah target/release/zed

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognix-linux-x86_64
          path: target/release/zed
          compression-level: 0
          retention-days: 14
