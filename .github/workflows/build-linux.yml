name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    container:
      image: ubuntu:20.04
      options: --user root
    
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l

    steps:
      - name: Install basic tools
        run: |
          apt-get update
          apt-get install -y curl git ca-certificates gnupg lsb-release sudo

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ./script/linux

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "cognix-linux-v3"
          workspaces: "."
          shared-key: "linux-release-docker"

      - name: System Info
        run: |
          echo "=== System Info ==="
          echo "OS: $(cat /etc/os-release | grep PRETTY_NAME)"
          echo "GLIBC: $(ldd --version 2>&1 | head -1)"
          free -h
          df -h /
          nproc
          rustc --version
          cargo --version
          echo "=================="

      - name: Build
        run: |
          export CARGO_BUILD_JOBS=4
          cargo build --release -p zed
        timeout-minutes: 240

      - name: Strip binary
        run: |
          strip target/release/zed
          ls -lah target/release/zed

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognix-linux-x86_64
          path: target/release/zed
          compression-level: 0
          retention-days: 14
