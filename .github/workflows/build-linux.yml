name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "cognix-linux"
          workspaces: "."

      - name: Build
        run: |
          echo "=== System Info ==="
          free -h
          df -h /
          nproc
          echo "=================="
          cargo build --release -p zed

      - name: Strip binary
        run: |
          strip target/release/zed
          ls -lah target/release/zed

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognix-linux-x86_64
          path: target/release/zed
          compression-level: 0
          retention-days: 14
