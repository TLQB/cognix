name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    container:
      image: ubuntu:20.04
      options: --user root
    
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l
      HOME: /root
      CC: clang-18
      CXX: clang++-18

    steps:
      - name: Install basic tools
        run: |
          # Mirrors occasionally reset the connection; retry instead of
          # failing the whole build.
          for i in 1 2 3; do
            apt-get update && break
            if [ "$i" = 3 ]; then echo "ERROR: apt-get update failed"; exit 1; fi
            echo "apt-get update attempt $i failed, retrying in 15s"
            sleep 15
          done
          for i in 1 2 3; do
            apt-get install -y curl git ca-certificates gnupg lsb-release sudo && break
            if [ "$i" = 3 ]; then echo "ERROR: apt-get install failed"; exit 1; fi
            echo "apt-get install attempt $i failed, retrying in 15s"
            sleep 15
          done

      - name: Verify Ubuntu 20.04 environment
        run: |
          echo "=== Environment Verification ==="
          echo "HOME=$HOME"
          OS=$(grep PRETTY_NAME /etc/os-release)
          echo "OS: $OS"
          if echo "$OS" | grep -q "20.04"; then
            echo "✅ Ubuntu 20.04 confirmed"
          else
            echo "❌ ERROR: Not Ubuntu 20.04!"
            exit 1
          fi
          GLIBC_VER=$(ldd --version 2>&1 | head -1 | awk '{print $NF}')
          echo "GLIBC: $GLIBC_VER"
          echo "================================="

      - name: Checkout
        uses: actions/checkout@v4

      # Must run before script/linux, whose `finalize` curls rustup with no
      # retries, and before the cache step, which shells out to `rustc -vV` and
      # silently disables itself when rustc is not on PATH.
      - name: Install Rust toolchain
        run: |
          if [ ! -x /root/.cargo/bin/rustup ]; then
            for i in 1 2 3 4 5; do
              curl --proto '=https' --tlsv1.2 -sSf \
                --connect-timeout 30 --max-time 180 \
                --retry 5 --retry-delay 5 --retry-connrefused \
                https://sh.rustup.rs -o /tmp/rustup-init.sh && break
              echo "rustup download attempt $i failed, retrying in 15s"
              rm -f /tmp/rustup-init.sh
              sleep 15
            done
            if [ ! -s /tmp/rustup-init.sh ]; then
              echo "ERROR: could not download the rustup installer"
              exit 1
            fi
            # `none` avoids installing an unused `stable`; the cargo/rustc
            # proxies pull the toolchain pinned in rust-toolchain.toml instead.
            sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal \
              --default-toolchain none
          fi
          # Put cargo on PATH for every later step, the cache action included.
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="/root/.cargo/bin:$PATH"
          rustc -vV
          cargo --version

      - name: Install Linux dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            ./script/linux && break
            if [ "$i" = 3 ]; then echo "ERROR: script/linux failed"; exit 1; fi
            echo "script/linux attempt $i failed, retrying in 20s"
            sleep 20
          done
          echo 'source "$HOME/.cargo/env"' >> /root/.bashrc

      - name: Install newer CMake
        run: |
          # wasmtime requires CMake >= 3.18, Ubuntu 20.04 only has 3.16
          apt-get install -y wget
          for i in 1 2 3; do
            wget -qO /tmp/kitware.asc --tries=3 --timeout=30 \
              https://apt.kitware.com/keys/kitware-archive-latest.asc && break
            if [ "$i" = 3 ]; then echo "ERROR: kitware key download failed"; exit 1; fi
            echo "kitware key download attempt $i failed, retrying in 15s"
            sleep 15
          done
          apt-key add /tmp/kitware.asc
          apt-get install -y software-properties-common
          apt-add-repository 'deb https://apt.kitware.com/ubuntu/ focal main'
          apt-get update
          apt-get install -y cmake
          cmake --version

      - name: Verify build tools
        run: |
          echo "=== Build Tools ==="
          echo "HOME=$HOME"
          rustc --version
          cargo --version
          clang-18 --version | head -1
          lld-18 --version | head -1
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "GLIBC: $(ldd --version 2>&1 | head -1)"
          echo "==================="

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "cognix-linux-docker-2004-v3"
          workspaces: "."
          shared-key: "linux-release-2004-v3"
          cache-on-failure: true

      - name: Build
        run: |
          export CARGO_BUILD_JOBS=4
          cargo build --release -p zed
        timeout-minutes: 240

      - name: Verify GLIBC compatibility
        run: |
          echo "=== GLIBC Verification ==="
          BINARY="target/release/zed"
          if [ ! -f "$BINARY" ]; then
            echo "❌ ERROR: Binary not found at $BINARY"
            exit 1
          fi
          GLIBC_REQ=$(strings "$BINARY" | grep -oP 'GLIBC_\d+\.\d+(\.\d+)?' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "Required GLIBC: $GLIBC_REQ"
          GLIBC_SYS=$(ldd --version 2>&1 | head -1 | awk '{print $NF}')
          echo "System GLIBC: $GLIBC_SYS"
          if [ "$(printf '%s\n' "$GLIBC_REQ" "$GLIBC_SYS" | sort -V | tail -1)" = "$GLIBC_SYS" ]; then
            echo "✅ Binary GLIBC requirement ($GLIBC_REQ) <= System GLIBC ($GLIBC_SYS)"
            echo "✅ Binary WILL run on Ubuntu 20.04+"
          else
            echo "❌ ERROR: Binary requires GLIBC $GLIBC_REQ but system has $GLIBC_SYS"
            echo "❌ Binary will NOT run on Ubuntu 20.04!"
            exit 1
          fi
          echo "==========================="

      - name: Strip binary
        run: |
          strip target/release/zed
          ls -lah target/release/zed

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognix-linux-x86_64
          path: target/release/zed
          compression-level: 0
          retention-days: 14
