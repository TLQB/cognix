name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-latest runners ship with rustup pre-installed. We just need
      # to trigger installation of the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          # Ensure cargo bin dir is on PATH for subsequent steps
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          if (-not ($env:PATH -split ';' -contains $cargoBin)) {
              $env:PATH = "$cargoBin;$env:PATH"
              echo "$cargoBin" >> $env:GITHUB_PATH
          }
          # Trigger toolchain install from rust-toolchain.toml
          rustup show
          rustc -vV
          cargo --version

      - name: Set up MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake
        shell: pwsh
        run: |
          $cmakeVersion = "3.30.5"
          $cmakeUrl = "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/cmake-$cmakeVersion-windows-x86_64.zip"
          $cmakeZipPath = "$env:TEMP\cmake.zip"
          $cmakeExtractPath = "$env:TEMP\cmake"

          $downloaded = $false
          for ($i = 1; $i -le 5; $i++) {
              curl.exe -L --connect-timeout 30 --max-time 600 --retry 5 --retry-delay 5 `
                  -o "$cmakeZipPath" "$cmakeUrl"
              if ($LASTEXITCODE -eq 0) {
                  $downloaded = $true
                  break
              }
              Write-Host "CMake download attempt $i failed, retrying in 15s..."
              Start-Sleep -Seconds 15
          }
          if (-not $downloaded) {
              Write-Host "ERROR: Failed to download CMake after 5 attempts"
              exit 1
          }

          Expand-Archive -Path "$cmakeZipPath" -DestinationPath "$cmakeExtractPath" -Force
          $cmakeBinPath = "$cmakeExtractPath\cmake-$cmakeVersion-windows-x86_64\bin"

          $env:PATH = "$cmakeBinPath;$env:PATH"
          echo "$cmakeBinPath" >> $env:GITHUB_PATH

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $mingwPath = "C:\ProgramData\chocolatey\lib\mingw\tools\install\path\bin"
          if (Test-Path $mingwPath) {
              $env:PATH = "$mingwPath;$env:PATH"
              echo "$mingwPath" >> $env:GITHUB_PATH
          } else {
              Write-Host "WARNING: MinGW path not found at expected location"
          }

      - name: Verify build tools
        shell: pwsh
        run: |
          Write-Host "=== Build Tools ==="
          rustc --version
          cargo --version
          cl 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
          Write-Host "INCLUDE=$env:INCLUDE"
          Write-Host "LIB=$env:LIB"
          Write-Host "==================="

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "cognix-windows-v2"
          workspaces: "."
          shared-key: "windows-release-v2"
          cache-on-failure: true

      - name: Build
        shell: pwsh
        run: |
          cargo build --release -p zed --target x86_64-pc-windows-msvc
        timeout-minutes: 240

      - name: Verify binary exists
        shell: pwsh
        run: |
          $binary = "target/x86_64-pc-windows-msvc/release/zed.exe"
          if (Test-Path $binary) {
              Write-Host "Binary found: $binary"
              $size = (Get-Item $binary).Length / 1MB
              Write-Host "Size: $([math]::Round($size, 2)) MB"
          } else {
              Write-Host "ERROR: Binary not found at $binary"
              exit 1
          }

      - name: Download ConPTY (OpenConsole + conpty.dll)
        shell: pwsh
        run: |
          # Microsoft Terminal v1.23.10353.0 — ConPTY backend for integrated terminal.
          # Without these files, zed.exe cannot spawn a shell on Windows.
          $termVersion = "1.23.10353.0"
          $termUrl = "https://github.com/microsoft/terminal/releases/download/v$termVersion/Microsoft.WindowsTerminal_$termVersion.x64.zip"
          $termZipPath = "$env:TEMP\terminal.zip"
          $termExtractPath = "$env:TEMP\terminal"

          $downloaded = $false
          for ($i = 1; $i -le 5; $i++) {
              curl.exe -L --connect-timeout 30 --max-time 600 --retry 5 --retry-delay 5 `
                  -o "$termZipPath" "$termUrl"
              if ($LASTEXITCODE -eq 0) {
                  $downloaded = $true
                  break
              }
              Write-Host "Terminal download attempt $i failed, retrying in 15s..."
              Start-Sleep -Seconds 15
          }
          if (-not $downloaded) {
              Write-Host "ERROR: Failed to download Microsoft Terminal after 5 attempts"
              exit 1
          }

          Expand-Archive -Path "$termZipPath" -DestinationPath "$termExtractPath" -Force

          $releaseDir = "target/x86_64-pc-windows-msvc/release"
          $openConsole = Get-ChildItem -Path "$termExtractPath" -Recurse -Filter "OpenConsole.exe" | Select-Object -First 1
          $conptyDll = Get-ChildItem -Path "$termExtractPath" -Recurse -Filter "conpty.dll" | Select-Object -First 1

          if (-not $openConsole -or -not $conptyDll) {
              Write-Host "ERROR: OpenConsole.exe or conpty.dll not found in Terminal package"
              exit 1
          }

          Copy-Item $openConsole.FullName -Destination "$releaseDir\OpenConsole.exe" -Force
          Copy-Item $conptyDll.FullName -Destination "$releaseDir\conpty.dll" -Force
          Write-Host "Bundled OpenConsole.exe: $((Get-Item "$releaseDir\OpenConsole.exe").Length / 1KB) KB"
          Write-Host "Bundled conpty.dll: $((Get-Item "$releaseDir\conpty.dll").Length / 1KB) KB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognix-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/zed.exe
            target/x86_64-pc-windows-msvc/release/OpenConsole.exe
            target/x86_64-pc-windows-msvc/release/conpty.dll
          compression-level: 0
          retention-days: 14
